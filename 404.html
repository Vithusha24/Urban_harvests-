<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found</title>
  <link rel="stylesheet" href="src/styles.css">
</head>

<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">

  <section
    class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-green-900 to-green-800 text-white text-center">
    <div class="max-w-lg animate-fade-in-up">
      <div class="text-9xl mb-4 opacity-20 font-bold">404</div>
      <h1 class="text-4xl font-bold mb-6">Oops! Page Not Found</h1>
      <p class="text-xl mb-10 opacity-90 leading-relaxed">
        The page you’re looking for doesn’t exist or has been moved.
        Let’s get you back to a greener place. 🌿
      </p>
      <a href="index.html"
        class="btn-primary inline-block px-8 py-3 text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition duration-300">
        Go Back Home
      </a>
    </div>
  </section>

  <script type="module" src="src/main.js"></script>
</body>

</html>
